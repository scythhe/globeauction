services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: globeauction
      POSTGRES_PASSWORD: globeauction
      POSTGRES_DB: globeauction_dev
    ports:
      - "5432:5432"
    volumes:
      - globeauction_pgdata:/var/lib/postgresql/data

  # Local stand-in for Cloudflare R2 (§11) — same S3 API, so the app code
  # doesn't know the difference. Swap the S3_* env vars for real R2
  # credentials in production; nothing else changes.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - globeauction_minio:/data

volumes:
  globeauction_pgdata:
  globeauction_minio:
